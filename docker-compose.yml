services:
  postgres:
    image: postgres:16-alpine
    container_name: happy-postgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DOCKER_POSTGRES_ADMIN_PASSWORD:-happy_local_admin_password}
      HAPPY_DB_NAME: ${POSTGRES_DB:-happy}
      HAPPY_DB_USER: ${POSTGRES_USER:-happy}
      HAPPY_DB_PASSWORD: ${POSTGRES_PASSWORD:-happy_dev_password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/docker/init-app.sql:/docker-entrypoint-initdb.d/10-happy.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  object-storage:
    image: chrislusf/seaweedfs:4.48
    command:
      - mini
      - -dir=/data
      - -ip=object-storage
      - -ip.bind=0.0.0.0
      - -s3.port=9000
      - -admin.ui=false
      - -webdav=false
      - -master.telemetry=false
      - -s3.port.iceberg=0
      - -s3.port.lance=0
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-happy_local}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-happy_local_storage_password}
      S3_BUCKET: ${S3_BUCKET:-happy-local-private}
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - object-data:/data

volumes:
  postgres-data:
  object-data:
