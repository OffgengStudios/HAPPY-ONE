[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "happy-api"
version = "1.0.0rc1"
description = "HAPPY Management Platform API"
requires-python = ">=3.12"
dependencies = [
  "certifi>=2026.10.19",
  "cryptography>=50.0.2,<51",
  "python-multipart>=0.0.20,<1",
  "pypdf>=6.21.2,<7",
  "phonenumbers>=9,<10",
  "argon2-cffi>=25.1,<26",
  "email-validator>=2.2,<3",
  "boto3>=1.35,<2",
  "alembic>=1.13.3",
  "fastapi>=0.115.0",
  "psycopg[binary]>=3.2.3",
  "pydantic-settings>=2.5.2",
  "PyJWT[crypto]>=2.10,<3",
  "opentelemetry-sdk>=1.38,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.38,<2",
  "opentelemetry-instrumentation-fastapi>=0.59b0,<1",
  "opentelemetry-instrumentation-sqlalchemy>=0.59b0,<1",
  "sqlalchemy>=2.0.35",
  "uvicorn[standard]>=0.32.0"
]

[project.optional-dependencies]
dev = [
  "filelock>=4.2.1,<5",
  "boto3-stubs[s3]>=1.35,<2",
  "httpx>=0.27.2",
  "mypy>=1.11.2",
  "pip-audit>=2.7",
  "psutil>=6.1",
  "types-psutil>=6.1",
  "pytest>=9.0.3,<10",
  "ruff>=0.6.9"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires live local PostgreSQL and private S3 storage"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Preserve SQL text in this already-applied draft revision.
"0008_supply_permissions.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
