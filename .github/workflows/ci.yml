name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - development

permissions:
  contents: read

jobs:
  cv-parser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CV-Parser-main/cv_system_output
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated HAPPY parser dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-happy.txt pytest httpx
      - name: Validate HAPPY parser runtime
        run: python -m compileall -q happy_service.py parser classifier
      - name: Test HAPPY parser contract
        run: python -m pytest tests/test_happy_service.py -q

  platform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: HAPPY_PLATFORM_CODEX
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: happy_test
          POSTGRES_USER: happy
          POSTGRES_PASSWORD: happy_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U happy -d happy_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://happy:happy_dev_password@localhost:5432/happy_test
      APP_ENV: test
      S3_ENDPOINT_URL: http://127.0.0.1:9000
      S3_BUCKET: happy-test-private
      S3_ACCESS_KEY_ID: happy_local
      S3_SECRET_ACCESS_KEY: happy_local_storage_password
      UNIJAY_REPOSITORY: ${{ github.workspace }}/UNIJAY
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/HAPPY_PLATFORM_CODEX/.local/browsers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: HAPPY_PLATFORM_CODEX/pnpm-lock.yaml
      - uses: actions/checkout@v4
        with:
          repository: OffgengStudios/UNIJAY-FASHION-DATA-COLLECTION
          ref: ${{ vars.UNIJAY_INTAKE_REF || 'main' }}
          path: UNIJAY
          token: ${{ secrets.UNIJAY_REPO_READ_TOKEN || github.token }}
      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e apps/api[dev]
          .venv/bin/python -m pip install -r ../CV-Parser-main/cv_system_output/requirements-happy.txt
          pnpm install --frozen-lockfile
      - name: Install browser
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/HAPPY_PLATFORM_CODEX/.local/browsers
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Start private object storage
        run: |
          python scripts/install_storage.py
          APP_ENV=development pnpm storage:local
      - name: UNIJAY desktop and mobile browser contracts
        run: node ../integration/unijay-browser.cjs
      - name: Verify foundation
        run: pnpm verify
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundation-browser-results
          path: |
            HAPPY_PLATFORM_CODEX/apps/web/test-results
            .local/unijay-consolidation/unijay-*.png
          retention-days: 7

  unijay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: OffgengStudios/UNIJAY-FASHION-DATA-COLLECTION
          ref: ${{ vars.UNIJAY_INTAKE_REF || 'main' }}
          token: ${{ secrets.UNIJAY_REPO_READ_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check data-collection-tool/app.js
      - run: node --test tests/*.test.cjs
      - run: node build.mjs
        env:
          HAPPY_API_BASE_URL: https://happy-api.example.invalid

  retained-legacy-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check frontend/js/public-intake.js
      - run: node --check frontend/js/form-controls.js
      - run: node --check portal/src/app.js
      - run: node --test integration/frontend.test.cjs

  integration-contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: HAPPY_PLATFORM_CODEX
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -e apps/api[dev] -r ../CV-Parser-main/cv_system_output/requirements-happy.txt reportlab
      - run: python -m pytest apps/api/tests/test_intake_contract_unit.py apps/api/tests/test_cv_parser_adapter_unit.py -q
      - run: python -m pytest ../CV-Parser-main/tests-happy -q
