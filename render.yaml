services:
  - type: web
    name: happy-platform-api
    runtime: docker
    dockerContext: .
    dockerfilePath: ./infra/deployment/api.Dockerfile
    preDeployCommand: alembic upgrade head
    healthCheckPath: /api/v1/health/ready
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_NAME
        value: HAPPY Management Platform
      - key: HAPPY_RELEASE_VERSION
        value: 1.0.0-rc.1
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        sync: false
      - key: API_CORS_ORIGINS
        value: '["https://happy-platform-web.onrender.com"]'
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: IDENTITY_ENCRYPTION_KEY
        generateValue: true
      - key: IDENTITY_LOOKUP_KEY
        generateValue: true
      - key: AUTH_SESSION_HOURS
        value: "8"
      - key: AUTH_IDLE_MINUTES
        value: "30"
      - key: AUTH_LOGIN_LIMIT
        value: "5"
      - key: AUTH_IP_LIMIT
        value: "30"
      - key: AUTH_WINDOW_MINUTES
        value: "15"
      - key: SUPPLY_ONBOARDING_POLICY_APPROVED
        sync: false
      - key: SUPPLY_PRIVACY_NOTICE_VERSION
        sync: false
      - key: SUPPLY_REQUIRED_FIELDS
        sync: false
      - key: SUPPLY_REQUIRED_SECTIONS
        sync: false
      - key: FILE_SCAN_HOST
        sync: false
      - key: FILE_SCAN_PORT
        value: "3310"
      - key: CV_PARSER_PROVIDER
        sync: false
      - key: CV_PARSER_MODEL
        sync: false
      - key: HAMIS_INTEGRATION_TOKEN
        sync: false
      - key: EMPLOYER_PORTAL_INTEGRATION_TOKEN
        sync: false

  - type: web
    name: happy-platform-web
    runtime: docker
    dockerContext: .
    dockerfilePath: ./infra/deployment/web.Dockerfile
    healthCheckPath: /
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_APP_ENV
        value: production
      - key: NEXT_PUBLIC_RELEASE_VERSION
        value: 1.0.0-rc.1
      - key: API_INTERNAL_URL
        value: https://happy-platform-api.onrender.com
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://happy-platform-web.onrender.com/api/v1
